# Модели голоса для NOVA HELPER: собирает и выкладывает в выпуск `voice-models` (pre-release — игрокам как
# обновление не приходит, «последним» выпуском не становится). Программа скачивает их один раз,
# когда игрок включает голосовой вопрос.
#  • asr.zip    — распознавание речи GigaAM v2 (Сбер, лицензия MIT) + шумоподавление GTCRN
#  • tts-supertonic.zip — голос Supertonic 3 (Supertone: код MIT, веса OpenRAIL-M), программа берёт «Мужской 5».
#                 Сам ставит ударения — отдельный модуль произношения (eSpeak) больше не нужен.
# Запуск: вкладка Actions → «Модели голоса» → Run workflow.
name: Модели голоса

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать модели
        run: |
          set -e
          mkdir -p dl out
          cd dl
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fsSL -o asr.tar.bz2 "$B/asr-models/sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19.tar.bz2"
          curl -fsSL -o gtcrn_simple.onnx "$B/speech-enhancement-models/gtcrn_simple.onnx"
          curl -fsSL -o GIGAAM_LICENSE "https://raw.githubusercontent.com/salute-developers/GigaAM/main/LICENSE"
          curl -fsSL -o supertonic.tar.bz2 "$B/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2"
          tar xjf supertonic.tar.bz2
          curl -fsSL -o SUPERTONIC_WEIGHTS_LICENSE "https://huggingface.co/Supertone/supertonic-3/raw/main/LICENSE" || echo "OpenRAIL-M: https://huggingface.co/Supertone/supertonic-3" > SUPERTONIC_WEIGHTS_LICENSE
          tar xjf asr.tar.bz2
          sudo apt-get install -y -q zip >/dev/null

      - name: Упаковать
        run: |
          set -e
          # Архивы одинаковые от запуска к запуску (даты файлов и порядок фиксированы) — программа не качает их заново
          cd dl
          # Распознавание + шумоподавление
          mkdir -p asr
          cp sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19/model.int8.onnx asr/
          cp sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19/tokens.txt asr/
          cp gtcrn_simple.onnx asr/
          cp GIGAAM_LICENSE asr/LICENSE-GigaAM.txt
          (cd asr && find . -exec touch -h -d '2026-01-01 00:00:00' {} + && find . -type f | LC_ALL=C sort | zip -q -X -@ ../../out/asr.zip)
          # Голос Supertonic 3 (int8) — все 10 голосов в одной модели, программа берёт «Мужской 5»
          mkdir -p tts-supertonic
          cp sherpa-onnx-supertonic-3-tts-int8-2026-05-11/*.onnx sherpa-onnx-supertonic-3-tts-int8-2026-05-11/tts.json \
             sherpa-onnx-supertonic-3-tts-int8-2026-05-11/unicode_indexer.bin sherpa-onnx-supertonic-3-tts-int8-2026-05-11/voice.bin tts-supertonic/
          cp sherpa-onnx-supertonic-3-tts-int8-2026-05-11/LICENSE tts-supertonic/LICENSE-code-MIT.txt
          cp SUPERTONIC_WEIGHTS_LICENSE tts-supertonic/LICENSE-weights-OpenRAIL-M.txt
          printf 'Supertonic 3 (Supertone Inc.) — https://huggingface.co/Supertone/supertonic-3\r\nКод: MIT. Веса модели: OpenRAIL-M (см. LICENSE-weights). Сборка int8 для sherpa-onnx (k2-fsa).\r\n' > tts-supertonic/README.txt
          (cd tts-supertonic && find . -exec touch -h -d '2026-01-01 00:00:00' {} + && find . -type f | LC_ALL=C sort | zip -q -X -@ ../../out/tts-supertonic.zip)
          cd ../out
          ls -la
          # Описание для программы: размеры и контрольные суммы
          python3 - <<'PY'
          import hashlib, json, os
          files = {}
          for f in sorted(os.listdir('.')):
              if f.endswith('.zip'):
                  h = hashlib.sha256(open(f, 'rb').read()).hexdigest()
                  files[f[:-4]] = {'file': f, 'size': os.path.getsize(f), 'sha256': h}
          json.dump({'v': 1, 'files': files}, open('voice.json', 'w'), indent=2)
          print(open('voice.json').read())
          PY

      - name: Выложить в выпуск voice-models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Модели для голосового вопроса к ИИ. Программа скачивает их сама — вручную ничего делать не нужно. Состав и лицензии: распознавание GigaAM (MIT), голос Supertonic 3 (код MIT, веса OpenRAIL-M)."
          if gh release view voice-models -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit voice-models -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create voice-models -R "$GITHUB_REPOSITORY" --prerelease --title "Модели голоса" --notes "$NOTES"
          fi
          gh release upload voice-models -R "$GITHUB_REPOSITORY" out/asr.zip out/tts-supertonic.zip out/voice.json --clobber
          # Денис и eSpeak больше не нужны (заменены на Supertonic 3)
          for f in tts-denis.zip espeak.zip; do gh release delete-asset voice-models "$f" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true; done
